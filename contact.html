<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | ClickWise</title>

<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
  <div class="nav-left">
    <img src="clickwise_logo.png" class="logo">

    <div>
      <h1>ClickWise</h1>
      <p>Connecting Generations Through Technology</p>
    </div>
  </div>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="volunteer.html">Volunteer</a>
    <a href="hours.html">Log Hours</a>
    <a href="chapter.html">Start a Chapter</a>
    <a href="donate.html">Donate</a>
    <a href="contact.html" class="active"> Contact</a>
  </div>
</nav>

<section class="section">

  <div class="section-title">
    <p>Contact</p>
    <h2>We would love to hear from you.</h2>
  </div>

  <div class="grid-2">

    <div class="dashboard-card">

      <h3>Send a Message</h3>

      <form
        action="https://formspree.io/f/mlgvkjjo"
        method="POST"
        class="form-group">

        <input
          type="text"
          name="name"
          placeholder="Your Name"
          required>

        <input
          type="email"
          name="email"
          placeholder="Email Address"
          required>

        <input
          type="text"
          name="subject"
          placeholder="Subject">

        <textarea
          name="message"
          rows="6"
          placeholder="How can we help?"
          required></textarea>

        <input
          type="hidden"
          name="_next"
          value="thankyou.html">

        <button class="send-btn">
    <i class="fa-regular fa-paper-plane"></i>
    Send Message
</button>

      </form>

    </div>

    <div class="dashboard-card dark-card contact-card">

  <div class="contact-row">
    <div class="contact-icon">
  <i class="fa-solid fa-envelope"></i>
</div>
    <div>
      <h4>Email</h4>
      <p>
  <a href="mailto:clickwiseorg@gmail.com"
     class="contact-link">
     clickwiseorg@gmail.com
  </a>
</p>
    </div>
  </div>

  <div class="contact-row">
    <div class="contact-icon">
  <i class="fa-brands fa-instagram"></i>
</div>
    <div>
      <h4>Instagram</h4>
      <p>
  <a href="https://instagram.com/clickwiseorg"
     target="_blank"
     class="contact-link">
     @clickwiseorg
  </a>
</p>
    </div>
  </div>

  <div class="contact-row">
    <div class="contact-icon">
  <i class="fa-solid fa-phone"></i>
</div>
    <div>
      <h4>Phone</h4>
      <p>571-541-0189</p>
    </div>
  </div>

  <div class="contact-row">
    <div class="contact-icon">
  <i class="fa-solid fa-location-dot"></i>
</div>
    <div>
      <h4>Location</h4>
      <p>Fairfax, Virginia</p>
    </div>
  </div>

</div>

  </div>

</section>

<script src="script.js"></script>

</body>
</html>
